name: Standards
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node automation-tools/check-standards.js
      - run: node --test tests/standards/*.test.js
      - run: bash -n automation-tools/init-project.sh automation-tools/record-feedback.sh
      - run: node --check .agents/gemini-web-chat/server.js
